name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      mode-a-backend: ${{ steps.filter.outputs.mode_a_backend }}
      mode-a-frontend: ${{ steps.filter.outputs.mode_a_frontend }}
      mode-b-live: ${{ steps.filter.outputs.mode_b_live }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute path filters
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD^"
            fi
          fi
          CHANGED="$(git diff --name-only "$BASE"...HEAD || true)"
          echo "Changed files:"
          echo "$CHANGED"

          match() {
            echo "$CHANGED" | grep -E "$1" >/dev/null && echo true || echo false
          }

          MODE_A_BACKEND="$(match '^(backend/|requirements\.txt|quests/)')"
          MODE_A_FRONTEND="$(match '^frontend/')"
          MODE_B_LIVE="$(match '^(backend-live/|unity/|\.github/workflows/ci\.yml)')"

          if [ -z "$CHANGED" ]; then
            MODE_A_BACKEND=true
            MODE_A_FRONTEND=true
            MODE_B_LIVE=true
          fi

          echo "mode_a_backend=$MODE_A_BACKEND" >> "$GITHUB_OUTPUT"
          echo "mode_a_frontend=$MODE_A_FRONTEND" >> "$GITHUB_OUTPUT"
          echo "mode_b_live=$MODE_B_LIVE" >> "$GITHUB_OUTPUT"

  backend-tests:
    name: Backend tests (Python · Modo A)
    needs: changes
    if: needs.changes.outputs.mode-a-backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CQA_DATABASE_URL: postgresql://arena:arena@localhost:5432/arena_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (SQLite + PostgreSQL)
        run: python -m unittest discover -s backend/tests -p "test_*.py"

  frontend-build:
    name: Frontend build (Angular · Modo A)
    needs: changes
    if: needs.changes.outputs.mode-a-frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  backend-live-tests:
    name: Backend Live tests (Go · Modo B)
    needs: changes
    if: needs.changes.outputs.mode-b-live == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Test
        working-directory: backend-live
        run: go test ./...
